[project]
name = "house-prices"
version = "0.1.0"
description = "Kaggle House Prices — foundation-first regression project (OLS only)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pandas>=2.0",
    "numpy>=2.0",
    "scikit-learn>=1.6",
    "matplotlib>=3.10",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "jupyter>=1.1",
]

[build-system]
requires = ["uv_build>=0.11.13,<0.12.0"]
build-backend = "uv_build"
